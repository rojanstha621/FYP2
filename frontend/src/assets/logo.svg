  </g>
  
  <!-- Text -->
  <text x="60" y="38" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1e40af">PT</text>
  <text x="95" y="38" font-family="Arial, sans-serif" font-size="16" font-weight="500" fill="#64748b">Manager</text>
</svg>
