<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="180" height="54">
  <!-- Background -->
  <rect width="200" height="60" fill="none" rx="8"/>
  
  <!-- Medical cross symbol -->
  <circle cx="30" cy="30" r="22" fill="#2563eb" opacity="0.1"/>
  <g transform="translate(30, 30)">
    <!-- Vertical bar -->
    <rect x="-3" y="-12" width="6" height="24" fill="#2563eb" rx="2"/>
    <!-- Horizontal bar -->
